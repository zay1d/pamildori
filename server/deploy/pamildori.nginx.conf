# nginx server block for the Pamildori backend on a shared VPS.
# Place at /etc/nginx/sites-available/api.pamildori.uz and symlink into
# sites-enabled, then run certbot to add TLS (see README).
#
# The app container listens on 127.0.0.1:8090 (docker-compose.nginx.yml).
# certbot --nginx will inject the listen 443 / ssl_certificate lines and the
# HTTP->HTTPS redirect, so this file only needs the :80 block + proxy.

server {
    listen 80;
    listen [::]:80;
    server_name api.pamildori.uz;

    # API requests carry only tiny JSON / headers; audio is uploaded via the
    # Telegram bot, not through nginx. Audio is *streamed back* as a response,
    # which is not limited by this directive.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio streaming: pass Range through and don't buffer the response.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
