# nginx server block for the Pamildori backend on a shared VPS.
# The app container listens on 127.0.0.1:8090 (docker-compose.yml).
#
# TLS via certbot: the --nginx plugin can choke on a crowded nginx (duplicate
# listen 443 in other vhosts), so use the WEBROOT method, which is plugin-free:
#
#   sudo mkdir -p /var/www/certbot
#   # install THIS file first (it serves the ACME challenge from the webroot)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d api.pamildori.uz
#   # then uncomment the `listen 443 ssl` block below and reload again.

server {
    listen 80;
    listen [::]:80;
    server_name api.pamildori.uz;

    # Let's Encrypt HTTP-01 challenge — served directly by nginx, never proxied.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Before a cert exists: proxy plain HTTP. After issuing the cert, switch the
    # line below to `return 301 https://$host$request_uri;` and enable the 443
    # block. (Keeping proxy here means the API also answers on http until then.)
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

