# Pamildori backend: app (API + bot) behind Caddy (auto-HTTPS via Let's Encrypt).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
