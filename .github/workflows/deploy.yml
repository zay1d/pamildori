name: Deploy web to GitHub Pages

# Собирает Vite-приложение из web/ и публикует на GitHub Pages.
# Триггерится на пуш в рабочую ветку (и вручную через "Run workflow").
on:
  push:
    branches: [claude/epic-shannon-3lf4C]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не публикуем параллельные деплои одновременно.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Включить Pages автоматически, если ещё не включён (не нужно лезть в настройки).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
